<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style/auth.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="auth-form">
            <h2>Регистрация</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" class="form-control" id="registerEmail" placeholder="Введите email">
                </div>
                <div class="form-group">
                    <label for="registerLogin">Логин</label>
                    <input type="text" class="form-control" id="registerLogin" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Пароль</label>
                    <input type="password" class="form-control" id="registerPassword" placeholder="Введите пароль">
                </div>
                <div class="form-group">
                    <label for="registerPasswordConfirm">Повторите пароль</label>
                    <input type="password" class="form-control" id="registerPasswordConfirm"
                        placeholder="Повторите пароль">
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="registerAgreement">
                    <label class="form-check-label" for="registerAgreement">Согласие с условиями регистрации</label>
                </div>
                <button type="submit" class="btn btn-dark btn-block">Зарегистрироваться</button>
            </form>
            <div class="text-center">
                <p>Уже есть аккаунт? <a href="login.html">Авторизоваться</a></p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
